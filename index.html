<!DOCTYPE html>
<html lang="en">
	<!-- head -->
	<head>
	<title>Teddy Productions</title>
	<!-- meta -->
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">	
	<meta name="viewport" content ="width=device-width, initial-scale = 1.0, user-scalable = no" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black" />
	<!-- link -->
	<link rel="shortcut icon" href="resources/images/favicon.png" type="image/x-icon" />
	<link rel="apple-touch-icon" href="resources/images/appicon.png" />
	<link rel="apple-touch-startup-image" href="resources/images/startup-l.png" media="screen and (min-device-width: 481px) and (max-device-width: 1024px) and (orientation:landscape)" />
	<link rel="apple-touch-startup-image" href="resources/images/startup-p.png" media="screen and (min-device-width: 481px) and (max-device-width: 1024px) and (orientation:portrait)" />
	
	<link rel="stylesheet" href="src/css/jx.css" />
	<link rel="stylesheet" href="src/css/app.css" />
	
	<!-- scripts -->
	<script type="text/javascript" src="src/js/jx.js"></script>
	<script type="text/javascript" src="src/js/app.js"></script>
	
	</head>
	<!-- app body -->
	<body>
		<div id="wrap">
			<div id="in-wrap">
				<!-- begin -->
				
				<!-- header -->
				<div id="header">
					<h1 id="logo"><a class="logo" href="/">Teddy Productions by Teddy Moussignac</a></h1>
					<a id="sett-init" class="sett-init fx" href="javascript://"><span></span></a>
					<a id="spot-init" class="sett-init fx" href="javascript://"><span></span></a>
				</div>
				
				<!-- panes -->
				<ul id="panes">
					
					<!-- index pane -->
					<li id="index-p" class="pane">
						INDEX
					</li>
					
					<!-- work pane -->
					<li id="work-p" class="pane">
						WORK
					</li>
					
					<!-- notes pane -->
					<li id="notes-p" class="pane">
						NOTES
					</li>
					
					<!-- about pane -->
					<li id="about-p" class="pane">
						ABOUT
					</li>
					
					<!-- contact pane -->
					<li id="contact-p" class="pane">
						CONTACT
					</li>
					
				</ul>
				
				<!-- footer -->
				<div id="footer">
					<div id="nav">
						<!-- select disc -->
						<div id="sel-disc-wrap">
							<div id="sel-disc"></div>
							<div id="sel-disc-shade"></div>
						</div>
						<!-- nav list -->
						<ul id="nav-list">
							<li class="on" id="index-btn">
								<span class="label"></span>
								<a class="disc" href="javascript://"></a>
							</li>
							<li id="work-btn">
								<span class="label"></span>
								<a class="disc" href="javascript://"></a>
							</li>
							<li id="notes-btn">
								<span class="label"></span>
								<a class="disc" href="javascript://"></a>
							</li>
							<li id="about-btn">
								<span class="label"></span>
								<a class="disc" href="javascript://"></a>
							</li>
							<li id="contact-btn">
								<span class="label"></span>
								<a class="disc" href="javascript://"></a>
							</li>
						</ul>
						<!-- nav bars -->
						<div id="nav-bar">
							<div id="inner-nav-bar"></div>
						</div>
					</div>
					<!-- share list -->
					<div id="share-list">
						<a class="s-google ico" href="/"></a>
						<a class="s-facebook ico" href="/"></a>
						<a class="s-twitter ico" href="/"></a>
					</div>
				</div>
				
				<!-- end -->
			</div>
		</div>
		
		<!-- spotlight -->
		<div id="spot">
			<ul id="spot-sett-panes">
				<li id="spot-pane">
					Spotlight Coming soon...
				</li>
				<li id="sett-pane">
					Settings Coming soon...
				</li>
			</ul>
		</div>
		
		<!-- screen -->
		<div id="app-screen"></div>
	
	</body>
</html>
